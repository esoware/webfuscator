name: Deploy playground

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: playground-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # Vite bundles webfuscator from TypeScript through the `source` export
          # condition, so the deployed site is whatever this checkout holds.
          # Building from the tag is what keeps the site equal to npm latest.
          ref: ${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: pnpm
          node-version: '24.11.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm deploy:playground
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
