name: Stage npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  stage:
    name: Stage package
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm install --frozen-lockfile
      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./packages/webfuscator/package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
      - name: Prepare package files
        run: cp README.md LICENSE DISCLOSURE packages/webfuscator/
      - name: Stage package
        working-directory: packages/webfuscator
        env:
          NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm stage publish --access public --foreground-scripts --tag "$NPM_DIST_TAG"
